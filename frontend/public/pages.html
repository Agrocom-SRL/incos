<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INCOS · Lista de Inscripciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- React 18 + Babel -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
        integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
        integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
        integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
        crossorigin="anonymous"></script>

    <!-- dayjs + Ant Design (UMD) + Icons -->
    <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://unpkg.com/antd@5.16.0/dist/antd.min.js"></script>
    <script src="https://unpkg.com/@ant-design/icons@5.3.0/dist/index.umd.min.js"></script>

    <style>
        :root {
            --brand-50: #eef7f1;
            --brand-100: #d4ebdc;
            --brand-500: #157347;
            --brand-600: #0e6038;
            --brand-700: #0a4f2d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        #root {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #0f172a;
            background: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }

        /* Ant Design overrides */
        .ant-table-thead>tr>th {
            font-size: 11px !important;
            font-weight: 600 !important;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #6b7280 !important;
            padding: 14px 16px !important;
            border-bottom: 1px solid #eef0f2 !important;
        }

        .ant-table-tbody>tr>td {
            padding: 14px 16px !important;
            border-bottom: 1px solid #f3f4f6 !important;
        }

        .ant-table-tbody>tr:last-child>td {
            border-bottom: none !important;
        }

        .ant-table-tbody>tr.ant-table-row:hover>td {
            background: var(--brand-50) !important;
        }

        .ant-table-tbody>tr.ant-table-row-selected>td {
            background: var(--brand-50) !important;
        }

        .ant-checkbox-checked .ant-checkbox-inner {
            background-color: var(--brand-600) !important;
            border-color: var(--brand-600) !important;
        }

        .ant-checkbox:hover .ant-checkbox-inner,
        .ant-checkbox-input:focus+.ant-checkbox-inner {
            border-color: var(--brand-500) !important;
        }

        .ant-pagination-item-active {
            border-color: var(--brand-600) !important;
        }

        .ant-pagination-item-active a {
            color: var(--brand-700) !important;
        }

        .ant-segmented-item-selected {
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .ant-segmented-thumb {
            background: white !important;
        }

        .ant-btn-primary {
            background: var(--brand-700) !important;
            border-color: var(--brand-700) !important;
        }

        .ant-btn-primary:hover {
            background: var(--brand-600) !important;
            border-color: var(--brand-600) !important;
        }

        /* Loader */
        .boot {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            font-size: 13px;
            background: #f8fafc;
        }

        .boot .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--brand-600);
            margin: 0 3px;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .boot .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .boot .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div id="root">
        <div class="boot">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span style="margin-left:10px">Cargando interfaz INCOS…</span>
        </div>
    </div>

    <script type="text/babel" data-presets="env,react" src="tweaks-panel.jsx"></script>
    <script type="text/babel" data-presets="env,react" src="data.jsx"></script>
    <script type="text/babel" data-presets="env,react" src="sidebar.jsx"></script>
    <script type="text/babel" data-presets="env,react" src="app.jsx"></script>
</body>

</html>
