name: CI

on:
  pull_request:
    branches: [master, develop, studio]
  push:
    branches: [master, develop, studio]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Informativo: hay deuda de lint previa. Quitar continue-on-error al limpiarla.
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build

  backend:
    name: Backend (lint + sintaxis)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/package.json') != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Sintaxis de src
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

  studio:
    name: Studio (lint + build)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('studio/package.json') != '' }}
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
